name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dgate
          POSTGRES_PASSWORD: dgate
          POSTGRES_DB: dgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the SQLite tests plus the same suite against real PostgreSQL.
      DGATE_TEST_DATABASE_URL: postgresql+asyncpg://dgate:dgate@localhost:5432/dgate
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-fail-under=95

      - name: Build
        run: uv build

      - name: Smoke test the CLI
        run: |
          uv run dgate questions check examples/questions.yaml
          uv run dgate ask refund.eligible -q examples/questions.yaml -i '{"order_age_days": 12}'

      - name: Smoke test the API against PostgreSQL
        env:
          DGATE_DATABASE_URL: ${{ env.DGATE_TEST_DATABASE_URL }}
          DGATE_QUESTIONS_FILE: examples/questions.yaml
        run: |
          uv run dgate db downgrade base
          uv run dgate db upgrade
          # Run the installed entry point directly and stop it on exit. A server left
          # running under `uv run` holds uv's cache lock, which makes the setup-uv
          # post-job cache prune hang until it times out and fails the job.
          .venv/bin/dgate serve --port 8080 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          id=$(curl -sf -X POST localhost:8080/v1/decide \
            -H 'content-type: application/json' -H 'Idempotency-Key: smoke-1' \
            -d '{"question": "ticket.queue", "input": {"subject": "card declined"}}' | jq -r .id)
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/decide \
            -H 'content-type: application/json' -H 'Idempotency-Key: smoke-1' \
            -d '{"question": "ticket.queue", "input": {"subject": "card declined"}}')
          test "$status" = 200
          # Record an outcome over HTTP, replay it through the JSON Lines ingester (a
          # duplicate, so --strict passes), and check the stats see exactly one label.
          outcome="{\"decision_id\": \"$id\", \"outcome\": \"billing\"}"
          curl -sf -X POST localhost:8080/v1/outcomes \
            -H 'content-type: application/json' -d "$outcome"
          echo "$outcome" | .venv/bin/dgate outcomes ingest - --strict
          curl -sf localhost:8080/v1/outcomes/stats | jq -e '.questions[0].labeled == 1'
          # Calibration metrics see the same single label, over HTTP and the CLI.
          curl -sf 'localhost:8080/v1/calibration/metrics?bins=5' \
            | jq -e '.reports[0].count == 1 and (.reports[0].bins | length) == 5'
          .venv/bin/dgate calibration report --bins 5 --show-bins
