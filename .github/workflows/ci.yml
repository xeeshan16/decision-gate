name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dgate
          POSTGRES_PASSWORD: dgate
          POSTGRES_DB: dgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the SQLite tests plus the same suite against real PostgreSQL.
      DGATE_TEST_DATABASE_URL: postgresql+asyncpg://dgate:dgate@localhost:5432/dgate
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-fail-under=95

      - name: Build
        run: uv build

      - name: Smoke test the CLI
        run: |
          uv run dgate questions check examples/questions.yaml
          uv run dgate ask refund.eligible -q examples/questions.yaml -i '{"order_age_days": 12}'
          uv run dgate fake-gate -q examples/questions.yaml -n 2000 --target-precision 0.9
          uv run dgate routing check examples/routing.yaml -q examples/questions.yaml

      - name: Smoke test the API against PostgreSQL
        env:
          DGATE_DATABASE_URL: ${{ env.DGATE_TEST_DATABASE_URL }}
          DGATE_QUESTIONS_FILE: examples/questions.yaml
          DGATE_ROUTING_FILE: examples/routing.yaml
        run: |
          uv run dgate db downgrade base
          uv run dgate db upgrade
          # Run the installed entry point directly and stop it on exit. A server left
          # running under `uv run` holds uv's cache lock, which makes the setup-uv
          # post-job cache prune hang until it times out and fails the job.
          .venv/bin/dgate serve --port 8080 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          first=$(curl -sf -X POST localhost:8080/v1/decide \
            -H 'content-type: application/json' -H 'Idempotency-Key: smoke-1' \
            -d '{"question": "ticket.queue", "input": {"subject": "card declined"}}')
          # Nothing is calibrated yet, so the decision goes to a human.
          echo "$first" | jq -e '.tier == "human" and (.reason | endswith("not calibrated yet"))'
          id=$(echo "$first" | jq -r .id)
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/decide \
            -H 'content-type: application/json' -H 'Idempotency-Key: smoke-1' \
            -d '{"question": "ticket.queue", "input": {"subject": "card declined"}}')
          test "$status" = 200
          # Record an outcome over HTTP, replay it through the JSON Lines ingester (a
          # duplicate, so --strict passes), and check the stats see exactly one label.
          outcome="{\"decision_id\": \"$id\", \"outcome\": \"billing\"}"
          curl -sf -X POST localhost:8080/v1/outcomes \
            -H 'content-type: application/json' -d "$outcome"
          echo "$outcome" | .venv/bin/dgate outcomes ingest - --strict
          curl -sf localhost:8080/v1/outcomes/stats | jq -e '.questions[0].labeled == 1'
          # Calibration metrics see the same single label, over HTTP and the CLI.
          curl -sf 'localhost:8080/v1/calibration/metrics?bins=5' \
            | jq -e '.reports[0].count == 1 and (.reports[0].bins | length) == 5'
          .venv/bin/dgate calibration report --bins 5 --show-bins
          # The refit job runs against the calibrator registry: one label is below
          # min_count, so it is skipped and nothing is stored.
          curl -sf -X POST localhost:8080/v1/calibrators/refit \
            -H 'content-type: application/json' -d '{"question": "ticket.queue", "min_count": 2}' \
            | jq -e '.outcome == "skipped" and .labeled == 1'
          .venv/bin/dgate calibrators refit --all --min-count 2 | grep -q skipped
          curl -sf localhost:8080/v1/calibrators | jq -e '.calibrators == []'
          # Threshold selection and conformal sets read the same single label: too few to
          # automate anything, and too few for a finite conformal quantile.
          curl -sf -X POST localhost:8080/v1/thresholds/select \
            -H 'content-type: application/json' \
            -d '{"question": "ticket.queue", "min_accepted": 1, "holdout": 0}' \
            | jq -e '.basis.labeled == 1 and .threshold == null and .tested == 1'
          curl -sf -X POST localhost:8080/v1/conformal/fit \
            -H 'content-type: application/json' -d '{"question": "ticket.queue", "holdout": 0}' \
            | jq -e '.trivial == true and .calibration_count == 1'
          .venv/bin/dgate thresholds select ticket.queue --min-accepted 1 --holdout 0
          .venv/bin/dgate conformal fit ticket.queue --holdout 0 | grep -q "every label"
          # Routing rules: with no calibrator and one label, nothing can be automated, and
          # every question's rule is current until a policy or calibrator changes.
          curl -sf -X POST localhost:8080/v1/routing/refresh \
            -H 'content-type: application/json' -d '{}' \
            | jq -e '(.rules | length) == 3 and all(.rules[]; .auto_threshold == null)'
          curl -sf localhost:8080/v1/routing/status \
            | jq -e 'all(.questions[]; .state == "current")'
          .venv/bin/dgate routing refresh ticket.queue | grep -q "auto none"
          # Review queue: every decision so far went to a human. The first one's outcome
          # arrived over HTTP, so its review item was superseded. A new decision waits in
          # the queue; claiming and resolving it records the answer as its outcome.
          curl -sf 'localhost:8080/v1/reviews?state=superseded' | jq -e '(.items | length) == 1'
          second=$(curl -sf -X POST localhost:8080/v1/decide \
            -H 'content-type: application/json' \
            -d '{"question": "ticket.queue", "input": {"subject": "where is my parcel"}}' \
            | jq -r .id)
          item=$(curl -sf -X POST localhost:8080/v1/reviews/claim \
            -H 'content-type: application/json' -d '{"reviewer": "ci"}')
          echo "$item" | jq -e --arg d "$second" '.decision_id == $d and .state == "claimed"'
          curl -sf -X POST "localhost:8080/v1/reviews/$(echo "$item" | jq -r .id)/resolve" \
            -H 'content-type: application/json' -d '{"reviewer": "ci", "outcome": "shipping"}' \
            | jq -e '.item.verdict == "decided" and .item.state == "resolved"'
          curl -sf "localhost:8080/v1/decisions/$second" | jq -e '.outcome.source == "review"'
          curl -sf localhost:8080/v1/reviews/stats \
            | jq -e '.queues[0].resolved == 1 and .queues[0].superseded == 1'
          .venv/bin/dgate reviews backfill | grep -q "enqueued 0"
          .venv/bin/dgate reviews stats
          # Drift monitoring: two decisions are far too few for any signal, so every check
          # is "insufficient", nothing is tightened and no alert is due.
          curl -sf -X POST localhost:8080/v1/drift/check \
            -H 'content-type: application/json' -d '{}' \
            | jq -e '(.checks | length) == 3 and all(.checks[]; .status == "insufficient" and .action == "none" and .alert == null)'
          curl -sf localhost:8080/v1/drift/status | jq -e 'all(.questions[]; .latest != null)'
          .venv/bin/dgate drift check ticket.queue | grep -q "INSUFFICIENT"
          .venv/bin/dgate drift list | grep -c "ticket.queue@v1" | grep -q 2
